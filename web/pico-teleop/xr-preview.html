<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SO101 · 头显操作视野预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0c151a;color:#e4f2ed;font:15px/1.6 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1180px;margin:auto;padding:28px}h1{font-size:28px;margin:5px 0}p{color:#a4bcb9}header{display:flex;justify-content:space-between;gap:20px;align-items:center}small{color:#79d7ba;letter-spacing:.12em}#preview{display:block;width:100%;height:66vh;min-height:430px;background:#101c25;border:1px solid #32484e;border-radius:16px}button{background:#182d30;color:#dcece6;border:1px solid #36534f;border-radius:8px;padding:8px 16px;font:inherit;cursor:pointer}button:focus-visible{outline:3px solid #a4e5c5;outline-offset:3px}nav{display:flex;flex-wrap:wrap;gap:10px;margin:16px 0}#state{color:#a4e5c5;font-size:13px;text-align:right}.viewport{position:relative}#headset-hud{position:absolute;top:34%;left:50%;transform:translate(-50%,-50%);width:min(64%,600px);height:auto;border-radius:12px;box-shadow:0 12px 40px #0005;pointer-events:none}.view-center{position:absolute;left:50%;top:50%;width:10px;height:10px;border:1px solid #728b8277;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}.view-note{position:absolute;bottom:15px;left:20px;color:#9cb7ae;font-size:12px}footer{font-size:13px;color:#94aca9;margin-top:15px}#demo-controls{border-left:1px solid #36534f;padding-left:12px;display:flex;gap:8px}#demo-controls[hidden]{display:none}@media(max-width:650px){main{padding:16px}header{display:block}#state{text-align:left;display:block}h1{font-size:24px}#headset-hud{width:90%}#demo-controls{border:0;padding:0;flex-wrap:wrap}#preview{height:65vh;min-height:400px}.view-note{max-width:85%}}
</style>
<main><header><div><small>PICO 4 × SO101 / TELEOP</small><h1>操作视野预览</h1></div><span id="state">正在连接…</span></header>
<p>提示集中在正前方略偏上，主操作用大字显示。中央和下方留给机械臂；提示内容与头显共用绘制代码。</p>
<nav aria-label="预览设置"><button id="front">正面观察</button><button id="side">侧面观察</button><span id="demo-controls" hidden><button id="demo-ready">待授权示例</button><button id="demo-following">跟随示例</button><button id="demo-stopped">停止示例</button></span></nav>
<div class="viewport"><canvas id="preview" aria-label="空间中的 SO101 三维机械臂"></canvas>
<canvas id="headset-hud" width="1024" height="384" role="img" aria-label="头显中文操作提示"></canvas><span class="view-center" aria-hidden="true"></span><span class="view-note">圆点为视线中心 · 这是电脑排版预览，实际视场以头显为准</span></div>
<footer id="preview-help">头显内：右 A 授权 · 握持键跟随 · 扳机夹爪 · A+握持键精细 · B 停止。绿色为反馈，橙色为夹爪；模型不显示真实障碍物。</footer></main>
<script src="/input.js"></script><script src="/hud.js"></script><script src="/scene.js"></script><script src="/preview.js"></script></html>
